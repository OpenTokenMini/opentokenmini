# Publishes the repo as raw files plus a markdown viewer at docs.opentokenmini.org
name: docs
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir _site
          git ls-files | grep -v '^\.github/' | xargs -I{} cp --parents {} _site/
          cp .github/pages/index.html .github/pages/logo.svg _site/
          { cat .github/pages/llms.txt; git ls-files '*.md' | sed 's|.*|- [&](https://docs.opentokenmini.org/&)|'; } > _site/llms.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: deploy
        uses: actions/deploy-pages@v4
