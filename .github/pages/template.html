<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<meta name="description" content="{description}">
<link rel="canonical" href="{url}">
<meta property="og:type" content="article">
<meta property="og:title" content="{title}">
<meta property="og:description" content="{description}">
<meta property="og:url" content="{url}">
<meta property="og:image" content="https://opentokenmini.org/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="alternate" type="text/markdown" href="{raw}" title="Raw markdown">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#eef1ec; --ink:#1f2a22; --dim:#5f6e62; --green:#2f7a4f; --line:#cdd5ce; --code:#e2e8e2 }
  body { margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.65 Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased }
  header { display:flex; gap:20px; align-items:center; padding:14px 24px; border-bottom:1px solid var(--line); font-size:14px }
  header .brand { display:flex; gap:8px; align-items:center; margin-right:auto; color:var(--ink); text-decoration:none;
                  font:400 15px "JetBrains Mono", monospace; letter-spacing:.02em; text-transform:uppercase }
  header .brand b { font-weight:800 }
  header .brand b:first-of-type { margin-right:.28em } header .brand b:last-of-type { margin-left:.28em }
  header a { color:var(--green); text-decoration:none }
  main { max-width:760px; margin:0 auto; padding:32px 24px 80px }
  a { color:var(--green) }
  code { font:14px "JetBrains Mono", monospace; background:var(--code); padding:1px 5px; border-radius:4px }
  pre { background:var(--code); padding:14px; border-radius:8px; overflow:auto } pre code { padding:0 }
  table { border-collapse:collapse } th, td { border-bottom:1px solid var(--line); padding:6px 10px; text-align:left }
  h1, h2, h3 { line-height:1.25 } h1 { font-size:28px } h2 { font-size:20px; margin-top:36px }
  .path { color:var(--dim); font:13px "JetBrains Mono", monospace }
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3BVRYNN200"></script>
<script>window.dataLayer = window.dataLayer || []; function gtag() { dataLayer.push(arguments); } gtag("js", new Date()); gtag("config", "G-3BVRYNN200");</script>
</head>
<body>
<header>
  <a class="brand" href="https://opentokenmini.org/"><img src="/logo.svg" width="22" height="22" alt=""><span><b>Open</b>Token<b>Mini</b></span></a>
  <a href="/">Docs</a>
  <a href="/llms.txt">For agents</a>
  <a href="https://github.com/OpenTokenMini/opentokenmini">GitHub</a>
</header>
<main><div class="path">{path} · <a href="{raw}">raw</a> · <a href="{github}">GitHub</a></div><article>
{body}
</article></main>
</body>
</html>
