<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTokenMini docs</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="alternate" type="text/plain" href="llms.txt" title="For agents">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root { --bg:#eef1ec; --ink:#1f2a22; --dim:#5f6e62; --green:#2f7a4f; --line:#cdd5ce; --code:#e2e8e2 }
  body { margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.65 Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased }
  header { display:flex; gap:20px; align-items:center; padding:14px 24px; border-bottom:1px solid var(--line); font-size:14px }
  header .brand { display:flex; gap:8px; align-items:center; margin-right:auto; color:var(--ink); text-decoration:none;
                  font:400 15px "JetBrains Mono", monospace; letter-spacing:.06em; text-transform:uppercase }
  header .brand b { font-weight:800 }
  header a { color:var(--green); text-decoration:none }
  main { max-width:760px; margin:0 auto; padding:32px 24px 80px }
  a { color:var(--green) }
  code { font:14px "JetBrains Mono", monospace; background:var(--code); padding:1px 5px; border-radius:4px }
  pre { background:var(--code); padding:14px; border-radius:8px; overflow:auto } pre code { padding:0 }
  table { border-collapse:collapse } th, td { border-bottom:1px solid var(--line); padding:6px 10px; text-align:left }
  h1, h2, h3 { line-height:1.25 } h1 { font-size:28px } h2 { font-size:20px; margin-top:36px }
  .path { color:var(--dim); font:13px "JetBrains Mono", monospace }
</style>
</head>
<body>
<header>
  <a class="brand" href="https://opentokenmini.org/"><img src="logo.svg" width="22" height="22" alt=""><span><b>Open</b>Token<b>Mini</b></span></a>
  <a href="#/README.md">Docs</a>
  <a href="#/AGENTS.md">For agents</a>
  <a href="https://github.com/OpenTokenMini/opentokenmini">GitHub</a>
</header>
<main><div class="path" id="path"></div><article id="doc"></article></main>
<script>
const REPO = "https://github.com/OpenTokenMini/opentokenmini/blob/main/";

async function load() {
  let path = decodeURIComponent(location.hash.slice(2)) || "README.md";
  let res = await fetch(path);
  for (const idx of ["README.md", "AGENTS.md"]) {
    if (res.ok || !path.endsWith("/")) break;
    res = await fetch(path + idx);
    if (res.ok) path += idx;
  }
  const doc = document.getElementById("doc");
  document.getElementById("path").textContent = path;
  if (!res.ok) { doc.innerHTML = `<p>Not found. <a href="${REPO + path}">Try GitHub</a></p>`; return; }
  doc.innerHTML = marked.parse(await res.text());
  const base = new URL(path, "https://x/");
  doc.querySelectorAll("a[href], img[src]").forEach(el => {
    const attr = el.tagName === "A" ? "href" : "src";
    const raw = el.getAttribute(attr);
    if (/^[a-z]+:|^#/i.test(raw)) return;
    const rel = new URL(raw, base).pathname.slice(1);
    if (attr === "src") el.src = rel;
    else el.href = /(\.md|\/)$/.test(rel) || rel === "" ? "#/" + rel : REPO + rel;
  });
  document.title = (doc.querySelector("h1")?.textContent || path) + " · OpenTokenMini";
  scrollTo(0, 0);
}
addEventListener("hashchange", load);
load();
</script>
</body>
</html>
